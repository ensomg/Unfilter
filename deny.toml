[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "LGPL-3.0-only",
    "MPL-2.0",
    # ring (crypto provider for rustls, ADR 003) bundles BoringSSL-derived code.
    "OpenSSL",
    # webpki-roots embeds the Mozilla CA set under this license.
    "CDLA-Permissive-2.0",
    # slint UI toolkit (ADR 004), used royalty-free; "Made with Slint" attributed.
    "LicenseRef-Slint-Royalty-free-2.0",
    # Boost Software License (clipboard-win, error-code via slint's winit backend).
    "BSL-1.0",
]
confidence-threshold = 0.9

# ring publishes a `license-file` rather than an SPDX expression, so its licence
# is stated explicitly here (the LICENSE hash is ring's well-known value; if a
# CI run reports a different hash, update it to the one cargo-deny prints).
[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
