[package]
name = "uf-ui"
version.workspace = true
edition.workspace = true
# slint >= 1.15 is required for Path rendering in the software renderer;
# slint 1.17+ needs Rust 1.92 (the workspace default of 1.85 would resolve to 1.13).
rust-version = "1.92"
license.workspace = true
publish.workspace = true
description = "Small native settings/status window"

[dependencies]
uf-ipc = { workspace = true }
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "raw-window-handle-06",
] }
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18.1"

[lints]
workspace = true
