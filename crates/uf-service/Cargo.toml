[package]
name = "uf-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Privileged Windows service hosting the engine"

[features]
# The live DoT transport (rustls + ring). On by default for the real service;
# turn it off to build/test the control plane without the TLS stack.
default = ["live-tls"]
live-tls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]

[dependencies]
uf-core = { workspace = true }
uf-capture = { workspace = true }
uf-dns = { workspace = true }
uf-probe = { workspace = true }
uf-fallback = { workspace = true }
uf-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8.19"
rustls = { workspace = true, optional = true }
rustls-pki-types = { version = "1.11", optional = true }
webpki-roots = { version = "1.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[lints]
workspace = true
