[package]
name = "unfilter"
version.workspace = true
edition.workspace = true
# Pulls in uf-ui (slint 1.18), which requires Rust 1.92.
rust-version = "1.92"
license.workspace = true
publish.workspace = true
description = "Unfilter: one executable running the service, tray and settings UI"

[dependencies]
uf-service = { workspace = true }
uf-ui = { workspace = true }
uf-tray = { workspace = true }
uf-ipc = { workspace = true }

[target.'cfg(windows)'.dependencies]
uf-capture = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = { workspace = true }

[lints]
workspace = true
